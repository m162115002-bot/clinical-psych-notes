<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>顳葉記憶不對稱性：Mr. B. 與 Ms. C. 動畫劇場</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #F7F5F0;
      --sage: #8BA88E;
      --blue: #7B9BB0;
      --coral: #D98A76;
      --beige: #E5D3B3;
      --ink: #2F3640;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-cream);
      color: var(--ink);
    }

    /* Cinematic Animations */
    @keyframes sceneEnter {
      from { opacity: 0; transform: scale(0.985) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }

    @keyframes headTilt {
      0%, 100% { transform: rotate(0deg); }
      30% { transform: rotate(-4deg); }
      70% { transform: rotate(3deg); }
    }

    @keyframes noteFall {
      0% { opacity: 0; transform: translate(0, -18px) rotate(-6deg); }
      20% { opacity: 1; transform: translate(10px, 0px) rotate(4deg); }
      75% { opacity: 1; transform: translate(28px, 42px) rotate(18deg); }
      100% { opacity: 0; transform: translate(40px, 75px) rotate(32deg); }
    }

    @keyframes flyAcross {
      0% { opacity: 0; transform: translateX(-36px) scale(0.85); }
      30% { opacity: 1; transform: translateX(0px) scale(1); }
      100% { opacity: 1; transform: translateX(0px) scale(1); }
    }

    @keyframes fadeBroken {
      0% { opacity: 1; transform: scale(1); }
      45% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0.22; transform: scale(0.9) translateY(6px); filter: grayscale(1); }
    }

    @keyframes wavePulse {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    @keyframes drawStroke {
      from { stroke-dashoffset: 300; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes digitPop {
      0% { opacity: 0; transform: translateY(14px) scale(0.7); }
      65% { opacity: 1; transform: translateY(-3px) scale(1.08); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes clockSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(720deg); }
    }

    @keyframes dissolveAway {
      0% { opacity: 0.9; transform: scale(1); }
      40% { opacity: 0.55; transform: scale(0.96); }
      100% { opacity: 0; transform: scale(0.85) translateY(-10px); }
    }

    @keyframes pulseLobe {
      0%, 100% { opacity: 0.78; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes progressRun {
      from { width: 0%; }
      to { width: 100%; }
    }

    .scene-enter { animation: sceneEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .char-breathe { animation: breathe 3s ease-in-out infinite; transform-origin: center bottom; }
    .char-blink { animation: blink 4s infinite; transform-origin: center; }
    .head-tilt { animation: headTilt 3.4s ease-in-out infinite; transform-origin: center bottom; }
    .note-fall-1 { animation: noteFall 3.6s ease-in-out infinite; }
    .note-fall-2 { animation: noteFall 3.6s ease-in-out 1.4s infinite; }
    .fly-in { animation: flyAcross 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .fade-broken { animation: fadeBroken 2.6s ease forwards; }
    .wave-ring { animation: wavePulse 1.8s ease-out infinite; transform-origin: center; }
    .draw-stroke { stroke-dasharray: 300; animation: drawStroke 1.2s ease forwards; }
    .digit-pop { animation: digitPop 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .clock-spin { animation: clockSpin 2.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-origin: 50% 50%; }
    .dissolve-away { animation: dissolveAway 2.8s ease forwards; }
    .pulse-lobe { animation: pulseLobe 2s ease-in-out infinite; transform-origin: center; }
    .auto-progress { animation: progressRun 6.5s linear forwards; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white/90 backdrop-blur border-b border-stone-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-[#E7EFF4] border border-[#7B9BB0]/40 flex items-center justify-center text-[#527388] font-bold text-sm">
          ▶
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-800">顳葉記憶不對稱性：動畫故事劇場</h1>
          <p class="text-xs text-slate-500">Mr. B.（左側顳葉）vs. Ms. C.（右側顳葉）</p>
        </div>
      </div>

      <button id="bilingualToggle" type="button"
        class="px-3 py-1.5 rounded-lg text-xs font-medium border border-stone-300 bg-stone-50 hover:bg-stone-100 text-slate-700 transition">
        雙語關鍵詞：開啟
      </button>
    </div>

    <!-- Mode Tabs -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 pb-2.5 flex gap-2 overflow-x-auto">
      <button data-tab="mrB" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap">
        Mr. B. 動畫故事（左側顳葉）
      </button>
      <button data-tab="msC" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap">
        Ms. C. 動畫故事（右側顳葉）
      </button>
      <button data-tab="compare" class="tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap">
        雙側對比總覽
      </button>
    </div>
  </header>

  <!-- Main Cinema Area -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-4 flex flex-col gap-3.5">

    <!-- Playback Bar -->
    <section id="playerBar" class="bg-white rounded-2xl border border-stone-200 px-4 py-2.5 shadow-sm flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button id="prevBtn" type="button" class="px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-slate-700 text-xs sm:text-sm font-medium transition disabled:opacity-40">
          ← 上一幕
        </button>
        <button id="playPauseBtn" type="button" class="px-4 py-1.5 rounded-lg bg-[#7B9BB0] hover:bg-[#66869B] text-white text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 shadow-sm">
          <span id="playIcon">❚❚</span>
          <span id="playLabel">暫停動畫</span>
        </button>
        <button id="nextBtn" type="button" class="px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-slate-700 text-xs sm:text-sm font-medium transition disabled:opacity-40">
          下一幕 →
        </button>
        <button id="replayBtn" type="button" class="px-2.5 py-1.5 rounded-lg border border-stone-200 hover:bg-stone-50 text-slate-600 text-xs font-medium transition">
          ↻ 重播本幕
        </button>
      </div>

      <div class="flex items-center gap-3">
        <div id="stepDots" class="flex items-center gap-1.5"></div>
        <span id="stepCounter" class="text-xs font-semibold text-slate-500 tabular-nums">1 / 4</span>
      </div>
    </section>

    <!-- Cinema Stage -->
    <section id="stageContainer" class="bg-white rounded-3xl border border-stone-200 shadow-sm overflow-hidden flex flex-col">
      <!-- Dynamic Animated Scene Injected Here -->
    </section>

    <p class="text-center text-xs text-slate-400 pb-2">
      提示：空白鍵（Space）暫停 / 繼續動畫；左右方向鍵（← / →）切換分鏡
    </p>
  </main>

  <script>
    const state = {
      activeTab: 'mrB',
      stepIndex: 0,
      isPlaying: true,
      showBilingual: true,
      timerId: null,
      msCTimerId: null,
      msCCountdown: 10,
      compareFocus: 'both',
      animKey: 0
    };

    function bi(text) {
      return state.showBilingual ? `<span class="block text-[11px] text-slate-400 font-normal mt-0.5">${text}</span>` : '';
    }

    function brainMiniSVG(damaged) {
      const lColor = damaged === 'left' ? '#D98A76' : '#8BA88E';
      const rColor = damaged === 'right' ? '#D98A76' : '#8BA88E';
      return `
        <svg viewBox="0 0 140 100" class="w-28 h-20">
          <path d="M67,14 C40,14 22,32 22,52 C22,74 39,88 67,88 Z" fill="#E7EFF4" stroke="#527388" stroke-width="2"/>
          <path d="M73,14 C100,14 118,32 118,52 C118,74 101,88 73,88 Z" fill="#E7EFF4" stroke="#527388" stroke-width="2"/>
          <ellipse cx="42" cy="63" rx="14" ry="10" fill="${lColor}" class="${damaged==='left'?'pulse-lobe':''}"/>
          <ellipse cx="98" cy="63" rx="14" ry="10" fill="${rColor}" class="${damaged==='right'?'pulse-lobe':''}"/>
          <text x="42" y="66" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">左</text>
          <text x="98" y="66" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">右</text>
        </svg>

    }

    const stories = {
      mrB: [
        {
          sceneTag: '第 1 幕 · 病前與發病',

          enSub: 'Left temporal lobe astrocytoma: forgetting appointments & mislaying reminder notes.',
          renderStage: () => `
            <div class="relative bg-gradient-to-b from-[#FBF7EF] to-[#F4EFE4] p-4 sm:p-6 min-h-[340px] flex items-center justify-center overflow-hidden">

                </div>
              </div>

              <!-- Animated Office Scene SVG -->

                <rect x="440" y="30" width="160" height="110" rx="10" fill="#E7EFF4" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="520" y1="30" x2="520" y2="140" stroke="#CBD5E1" stroke-width="2"/>
                <line x1="440" y1="85" x2="600" y2="85" stroke="#CBD5E1" stroke-width="2"/>

                <!-- Calendar with Missing Appointments -->
                <rect x="470" y="155" width="95" height="72" rx="8" fill="#FFFFFF" stroke="#D98A76" stroke-width="2"/>
                <rect x="470" y="155" width="95" height="20" rx="8" fill="#D98A76"/>
                <text x="517" y="169" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF">重要行程</text>
                <text x="517" y="205" text-anchor="middle" font-size="20" font-weight="700" fill="#D98A76">? ? ?</text>

                <!-- Desk -->
                <rect x="130" y="215" width="420" height="18" rx="6" fill="#C7B299"/>
                <rect x="160" y="233" width="16" height="55" fill="#A69076"/>
                <rect x="504" y="233" width="16" height="55" fill="#A69076"/>

                <!-- Mr. B Character (Animated Breathing & Head Tilt) -->
                <g class="char-breathe">
                  <!-- Torso / Suit -->
                  <path d="M245,215 L258,145 C262,132 318,132 322,145 L335,215 Z" fill="#527388"/>
                  <polygon points="290,142 280,175 290,192 300,175" fill="#FFFFFF"/>
                  <polygon points="290,145 285,172 290,185 295,172" fill="#D98A76"/>
                  <!-- Head -->
                  <g class="head-tilt">
                    <circle cx="290" cy="108" r="30" fill="#F2D2BD" stroke="#374151" stroke-width="2"/>
                    <path d="M262,100 C264,76 316,76 318,100 C306,88 274,88 262,100 Z" fill="#4B5563"/>
                    <g class="char-blink">
                      <circle cx="280" cy="108" r="2.8" fill="#1F2937"/>
                      <circle cx="300" cy="108" r="2.8" fill="#1F2937"/>
                    </g>
                    <!-- Worried Brow & Mouth -->
                    <path d="M273,100 Q280,97 285,101" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M295,101 Q300,97 307,100" fill="none" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M282,122 Q290,117 298,122" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round"/>
                    <!-- Thought Question Mark -->
                    <circle cx="338" cy="72" r="16" fill="#F9EAE6" stroke="#D98A76" stroke-width="2"/>
                    <text x="338" y="78" text-anchor="middle" font-size="18" font-weight="700" fill="#B55B46">?</text>
                  </g>
                </g>

                <!-- Falling / Mislaying Sticky Notes Animation -->
                <g class="note-fall-1">
                  <rect x="355" y="160" width="54" height="44" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
                  <line x1="363" y1="175" x2="399" y2="175" stroke="#B45309" stroke-width="2"/>
                  <line x1="363" y1="186" x2="390" y2="186" stroke="#B45309" stroke-width="2"/>
                </g>
                <g class="note-fall-2">
                  <rect x="190" y="165" width="54" height="44" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
                  <text x="217" y="191" text-anchor="middle" font-size="10" font-weight="700" fill="#92400E">遺失!</text>
                </g>
              </svg>
            </div>
          `
        },
        {
          sceneTag: '第 2 幕 · 魏氏記憶量表測驗',
          title: 'Anna Thompson 故事：細節在腦中大量流失',
          subtitle: '施測者朗讀包含 5 個核心細節的短文後，B 先生只零碎記起「被搶、去警局做新錢包、有些孩子」，關鍵記憶嚴重遺漏。',
          enSub: 'Wechsler Memory Scale: Anna Thompson story elements fade during Mr. B.’s verbal recall.',
          renderStage: () => `
            <div class="bg-gradient-to-b from-[#E7EFF4]/50 to-[#F7F5F0] p-4 sm:p-6 min-h-[340px] flex flex-col justify-center gap-5 scene-enter">
              <div class="grid grid-cols-1 md:grid-cols-11 gap-4 items-center">
                <!-- Examiner Speaking -->
                <div class="md:col-span-4 bg-white rounded-2xl p-4 border border-[#7B9BB0]/50 shadow-sm relative">
                  <div class="flex items-center gap-3 mb-3">
                    <div class="w-10 h-10 rounded-full bg-[#E8F0E9] border border-[#8BA88E] flex items-center justify-center text-lg relative">
                      👩‍⚕️
                      <span class="wave-ring absolute inset-0 rounded-full border-2 border-[#7B9BB0]"></span>
                    </div>
                    <div>
                      <div class="text-xs font-bold text-[#4C6B80]">施測者朗讀原文</div>
                      <div class="text-[11px] text-slate-400">Anna Thompson 故事</div>
                    </div>
                  </div>
                  <div class="space-y-1.5 text-xs">
                    <div class="px-2.5 py-1.5 rounded-lg bg-[#E7EFF4]/70 text-slate-700 fly-in">1. 南波士頓清潔婦 Anna</div>
                    <div class="px-2.5 py-1.5 rounded-lg bg-[#E7EFF4]/70 text-slate-700 fly-in" style="animation-delay:0.15s">2. 在 State St. 被搶 $15</div>
                    <div class="px-2.5 py-1.5 rounded-lg bg-[#E7EFF4]/70 text-slate-700 fly-in" style="animation-delay:0.3s">3. 4 個孩子・2 天沒吃・房租到期</div>
                    <div class="px-2.5 py-1.5 rounded-lg bg-[#E7EFF4]/70 text-slate-700 fly-in" style="animation-delay:0.45s">4. 員警受感動為她募資 (purse)</div>
                  </div>
                </div>

                <!-- Animated Memory Filter Arrow -->
                <div class="md:col-span-2 flex flex-col items-center justify-center py-2">
                  <div class="text-xs font-bold text-[#B55B46] mb-1">口語回憶</div>
                  <div class="w-12 h-12 rounded-full bg-[#F9EAE6] border-2 border-[#D98A76] flex items-center justify-center text-xl text-[#B55B46] pulse-lobe">
                    ➔
                  </div>
                  <div class="text-[11px] text-slate-500 mt-1">數分鐘後</div>
                </div>

                <!-- Mr. B Recall (Some Fade Out!) -->
                <div class="md:col-span-5 bg-white rounded-2xl p-4 border border-[#D98A76]/60 shadow-sm">
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-bold text-[#B55B46]">Mr. B. 的回憶結果</span>
                    <span class="px-2 py-0.5 rounded-full bg-[#D98A76] text-white text-[11px] font-bold">記憶流失</span>
                  </div>
                  <div class="space-y-2 text-xs">
                    <div class="px-2.5 py-1.5 rounded-lg bg-stone-100 text-slate-400 line-through fade-broken">南波士頓清潔婦・State St.・$15（遺忘）</div>
                    <div class="px-2.5 py-1.5 rounded-lg bg-[#F9EAE6] text-[#A34D39] font-semibold fly-in" style="animation-delay:0.4s">
                      ✓「一位女性被搶了，去警察局⋯」
                    </div>
                    <div class="px-2.5 py-1.5 rounded-lg bg-[#F9EAE6] text-[#A34D39] font-semibold fly-in" style="animation-delay:0.65s">
                      ⚠「警察幫她做了一個新錢包」（語意扭曲）
                    </div>
                    <div class="px-2.5 py-1.5 rounded-lg bg-[#F9EAE6] text-[#A34D39] font-semibold fly-in" style="animation-delay:0.9s">
                      ✓「她好像也有一些孩子」
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `
        },
        {
          sceneTag: '第 3 幕 · 保留的功能',
          title: '右側顳葉完好：數字廣度與幾何圖形回憶正常',
          subtitle: '與口語故事相反，B 先生能精準複誦 7 位數數字，幾何圖形記憶也完全在正常範圍內。',
          enSub: 'Intact right temporal lobe: 7-digit immediate recall & geometric designs remain normal.',
          renderStage: () => `
            <div class="bg-gradient-to-b from-[#E8F0E9]/50 to-[#F7F5F0] p-5 sm:p-7 min-h-[340px] flex flex-col justify-center scene-enter">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white rounded-2xl p-5 border border-[#8BA88E]/60 shadow-sm">
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-bold text-[#47684B]">立即數字廣度測驗</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-[#8BA88E] text-white text-xs font-bold">7 位數通過 ✓</span>
                  </div>
                  <div class="flex justify-center gap-2 py-4 flex-wrap">
                    ${['4','9','2','7','1','6','3'].map((n, i) => `
                      <div class="w-10 h-12 rounded-xl bg-[#E8F0E9] border-2 border-[#8BA88E] flex items-center justify-center font-bold text-xl text-[#47684B] digit-pop" style="animation-delay:${0.15 + i*0.14}s">
                        ${n}
                      </div>
                    `).join('')}
                  </div>
                  <p class="text-xs text-center text-slate-500">數字依序浮現並準確複誦</p>
                </div>

                <div class="bg-white rounded-2xl p-5 border border-[#7B9BB0]/60 shadow-sm">
                  <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-bold text-[#4C6B80]">幾何圖形回憶測驗</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-[#7B9BB0] text-white text-xs font-bold">正常範圍 ✓</span>
                  </div>
                  <div class="bg-[#F7F5F0] rounded-xl p-4 flex items-center justify-center">
                    <svg viewBox="0 0 240 85" class="w-full max-w-[240px] h-20">
                      <rect x="20" y="16" width="48" height="48" fill="none" stroke="#527388" stroke-width="3" class="draw-stroke"/>
                      <line x1="20" y1="16" x2="68" y2="64" stroke="#527388" stroke-width="2.5" class="draw-stroke" style="animation-delay:0.3s"/>
                      <circle cx="120" cy="40" r="24" fill="none" stroke="#8BA88E" stroke-width="3" class="draw-stroke" style="animation-delay:0.5s"/>
                      <polygon points="190,14 218,64 162,64" fill="none" stroke="#D98A76" stroke-width="3" class="draw-stroke" style="animation-delay:0.8s"/>
                    </svg>
                  </div>
                  <p class="text-xs text-center text-slate-500 mt-3">右側顳葉完好，幾何筆畫完整重現</p>
                </div>
              </div>
            </div>
          `
        },
        {
          sceneTag: '第 4 幕 · 小結',
          title: '左側顳葉受損：記憶功能的不對稱性',

    function stopAutoPlay() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
      state.isPlaying = false;
      updatePlayBtn();
    }

    function startAutoPlay() {
      if (state.activeTab === 'compare') return;
      if (state.timerId) clearInterval(state.timerId);
      state.isPlaying = true;
      updatePlayBtn();
      state.timerId = setInterval(() => {
        const list = stories[state.activeTab];
        state.stepIndex = (state.stepIndex + 1) % list.length;
        render();
      }, 6500);
    }

    function togglePlay() {
      if (state.activeTab === 'compare') return;
      if (state.isPlaying) {
        stopAutoPlay();
        render();
      } else {
        document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('imgModal').classList.add('hidden');
    });
    document.getElementById('imgModal').addEventListener('click', (e) => {
      if (e.target.id === 'imgModal') {
        document.getElementById('imgModal').classList.add('hidden');
      }
    });

    startAutoPlay();
        render();
      }
    }

    function updatePlayBtn() {
      const icon = document.getElementById('playIcon');
      const label = document.getElementById('playLabel');
      if (icon && label) {
        icon.textContent = state.isPlaying ? '❚❚' : '▶';
        label.textContent = state.isPlaying ? '暫停動畫' : '繼續播放';
      }
    }

    function stopMsCCountdown() {
      if (state.msCTimerId) {
        clearInterval(state.msCTimerId);
        state.msCTimerId = null;
      }
    }

    function startMsC10sSimulation() {
      stopMsCCountdown();
      state.msCCountdown = 10;
      const badge = document.getElementById('countdownBadge');
      const shapes = document.getElementById('stimulusShapes');
      const hint = document.getElementById('stimulusHint');
      if (!badge || !shapes || !hint) return;

      shapes.style.opacity = '1';
      badge.textContent = '10s';
      hint.textContent = '專注記憶圖形中...';

      state.msCTimerId = setInterval(() => {
        state.msCCountdown--;
        if (state.msCCountdown > 0) {
          badge.textContent = state.msCCountdown + 's';
        } else {
          stopMsCCountdown();
          badge.textContent = '0s（消失）';
          shapes.style.opacity = '0.06';
          hint.textContent = '10 秒結束！立即憑記憶繪製';
        }
      }, 600);
    }

    function render() {
      stopMsCCountdown();

      document.querySelectorAll('.tab-btn').forEach(btn => {
        const isActive = btn.dataset.tab === state.activeTab;
        btn.className = `tab-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap ${
          isActive ? 'bg-[#7B9BB0] text-white shadow-sm' : 'bg-stone-100 hover:bg-stone-200 text-slate-600'
        }`;
      });

      const playerBar = document.getElementById('playerBar');
      const stage = document.getElementById('stageContainer');

      if (state.activeTab === 'compare') {
        playerBar.classList.add('hidden');
        stage.innerHTML = renderCompare();
        stage.querySelectorAll('.cmp-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            state.compareFocus = btn.dataset.focus;
            render();
          });
        });
        return;
      }

      playerBar.classList.remove('hidden');
      updatePlayBtn();
      const list = stories[state.activeTab];
      const scene = list[state.stepIndex];

      document.getElementById('prevBtn').disabled = state.stepIndex === 0;
      document.getElementById('nextBtn').disabled = state.stepIndex === list.length - 1;
      document.getElementById('stepCounter').textContent = `${state.stepIndex + 1} / ${list.length}`;

      const dotsEl = document.getElementById('stepDots');
      dotsEl.innerHTML = list.map((_, idx) => `
        <button data-step="${idx}" class="dot-btn h-2.5 rounded-full transition-all ${
          idx === state.stepIndex ? 'w-7 bg-[#7B9BB0]' : 'w-2.5 bg-stone-300 hover:bg-stone-400'
        }" title="第 ${idx + 1} 幕"></button>
      `).join('');

      dotsEl.querySelectorAll('.dot-btn').forEach(dot => {
        dot.addEventListener('click', () => {
          stopAutoPlay();
          state.stepIndex = Number(dot.dataset.step);
          render();
        });
      });

      stage.innerHTML = `
        <div class="flex flex-col">
          ${scene.renderStage()}
          <!-- Cinema Subtitle Bar -->
          <div class="bg-white border-t border-stone-200 px-5 sm:px-7 py-4">
            <div class="flex items-center gap-2 mb-1">
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#E7EFF4] text-[#4C6B80]">${scene.sceneTag}</span>
              <h2 class="text-sm sm:text-base font-bold text-slate-800">${scene.title}</h2>
            </div>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">
              ${scene.subtitle}
              ${bi(scene.enSub)}
            </p>
          </div>
          <!-- Auto-play progress line -->
          <div class="h-1 bg-stone-100 w-full overflow-hidden">
            ${state.isPlaying ? `<div key="${state.stepIndex}-${state.animKey}" class="h-full bg-[#7B9BB0] auto-progress"></div>` : ''}
          </div>
        </div>
      `;

      const simBtn = document.getElementById('sim10sBtn');
      if (simBtn) {
        simBtn.addEventListener('click', startMsC10sSimulation);
      }
      const figImg = document.getElementById('fig1517Img');
      if (figImg) {
        figImg.addEventListener('click', () => {
          stopAutoPlay();
          document.getElementById('imgModal').classList.remove('hidden');
          render();
        });
      }
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        state.stepIndex = 0;
        if (state.activeTab === 'compare') {
          stopAutoPlay();
        } else {
          startAutoPlay();
        }
        render();
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      stopAutoPlay();
      if (state.stepIndex > 0) {
        state.stepIndex--;
        render();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      stopAutoPlay();
      const list = stories[state.activeTab];
      if (state.stepIndex < list.length - 1) {
        state.stepIndex++;
        render();
      }
    });

    document.getElementById('replayBtn').addEventListener('click', () => {
      state.animKey++;
      if (state.isPlaying) startAutoPlay();
      render();
    });

    document.getElementById('playPauseBtn').addEventListener('click', togglePlay);

    document.getElementById('bilingualToggle').addEventListener('click', (e) => {
      state.showBilingual = !state.showBilingual;
      e.currentTarget.textContent = `雙語關鍵詞：${state.showBilingual ? '開啟' : '關閉'}`;
      render();
    });

    document.addEventListener('keydown', (e) => {
      if (state.activeTab === 'compare') return;
      const list = stories[state.activeTab];
      if (e.key === 'ArrowRight' && state.stepIndex < list.length - 1) {
        stopAutoPlay();
        state.stepIndex++;
        render();
      } else if (e.key === 'ArrowLeft' && state.stepIndex > 0) {
        stopAutoPlay();
        state.stepIndex--;
        render();
      } else if (e.key === ' ') {
        e.preventDefault();
        togglePlay();
      }
    });

    startAutoPlay();
    render();
  </script>
